$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "muhaiminul@test.com",
      "password": "demo12345"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.token) { pm.collectionVariables.set('token', j.token); console.log('token saved'); }
      pm.test('logged in', () => pm.expect(j.success).to.be.true);
    language: text/javascript
order: 3000
