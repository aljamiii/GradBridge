$kind: http-request
url: "{{baseUrl}}/api/mentors"
method: GET
scripts:
  - type: afterResponse
    code: |-
      const j = pm.response.json();
      if (j.mentors && j.mentors.length) { pm.collectionVariables.set('mentorId', j.mentors[0].id); console.log('mentorId saved:', j.mentors[0].id); }
    language: text/javascript
order: 1000
